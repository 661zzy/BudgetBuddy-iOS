name: BudgetBuddy
options:
  bundleIdPrefix: cn.budgetbuddy
  settingPresets: project
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  BudgetBuddy:
    type: application
    platform: iOS
    dependencies:
      - target: BudgetBuddyWatch
    sources:
      - path: Sources
      - path: Resources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.budgetbuddy.BudgetBuddy
        DEVELOPMENT_TEAM: JUJB5U4698
        SDKROOT: iphoneos
        SKIP_INSTALL: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: "29"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "省钱搭子"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Light"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        # iPad support (v1.1): phone-style portrait layout, full screen.
        # UIRequiresFullScreen makes portrait-only legal on iPad (no Split View).
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "NO"
        Release:
          DEVELOPMENT_TEAM: JUJB5U4698
          CODE_SIGN_STYLE: Automatic
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "NO"
  # 临时记账 on the wrist (v1.5): amount keypad → category → queued to iPhone
  # over WatchConnectivity. Ships inside the iOS app.
  BudgetBuddyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    info:
      path: WatchApp/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: cn.budgetbuddy.BudgetBuddy
        CFBundleDisplayName: 省钱搭子
        # A custom Info.plist does NOT inherit these from build settings —
        # ASC validation requires them to match the containing iOS app.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.budgetbuddy.BudgetBuddy.watchkitapp
        DEVELOPMENT_TEAM: JUJB5U4698
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Embedded in the iOS app — must NOT surface as a top-level archive
        # product or App Store export finds two apps and refuses to distribute.
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "4"
        MARKETING_VERSION: "1.6.2"
        CURRENT_PROJECT_VERSION: "29"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_ALLOWED[sdk=watchos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=watchos*]: "NO"
        Release:
          DEVELOPMENT_TEAM: JUJB5U4698
          CODE_SIGN_STYLE: Automatic

  BudgetBuddyWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources:
      - path: WatchUITests
    dependencies:
      - target: BudgetBuddyWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.budgetbuddy.BudgetBuddyWatchUITests
        SDKROOT: watchos
        TEST_TARGET_NAME: BudgetBuddyWatch
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_ALLOWED[sdk=watchos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=watchos*]: "NO"

  # v1.5.3: first unit-test target — data-integrity checks on the bundled JSON.
  BudgetBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BudgetBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.budgetbuddy.BudgetBuddyTests
        SDKROOT: iphoneos
        # Link against the host app so @testable import resolves its types.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BudgetBuddy.app/BudgetBuddy"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "NO"

  BudgetBuddyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BudgetBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.budgetbuddy.BudgetBuddyUITests
        SDKROOT: iphoneos
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        TEST_TARGET_NAME: BudgetBuddy
        GENERATE_INFOPLIST_FILE: "YES"
        # Runner must match the app's device families or it runs iPhone-scaled
        # on iPad (and reports .phone idiom to the tests).
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "NO"
          CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "NO"
schemes:
  BudgetBuddy:
    build:
      targets:
        BudgetBuddy: all
        BudgetBuddyTests: [test]
        BudgetBuddyUITests: [test]
    test:
      targets:
        - BudgetBuddyTests
        - BudgetBuddyUITests
  BudgetBuddyWatch:
    build:
      targets:
        BudgetBuddyWatch: all
        BudgetBuddyWatchUITests: [test]
    test:
      targets:
        - BudgetBuddyWatchUITests
